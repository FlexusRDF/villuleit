<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1d2321;--mute:#5e6763;--line:#dfe3df;--accent:#1f6f4a;--accent2:#e9f3ee;--warn:#b3261e;--warnbg:#fdecea;--amber:#8a5a00;--amberbg:#fff4dc}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45}
header{background:var(--accent);color:#fff;padding:14px 16px 0}
header h1{margin:0;font-size:19px;font-weight:650}
header p{margin:2px 0 10px;font-size:13px;opacity:.85}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.langs{display:flex;gap:4px;flex:0 0 auto}
.langs button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:5px 6px;font-weight:700;font-size:13px;cursor:pointer}
.langs button.on{background:#fff;color:var(--accent)}
nav{display:flex;gap:4px}
nav a{flex:1;text-align:center;padding:11px 6px;color:#fff;text-decoration:none;font-weight:600;font-size:15px;border-radius:10px 10px 0 0;opacity:.8}
nav a.on{background:var(--bg);color:var(--accent);opacity:1}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.search{position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:2}
.srow{display:flex;gap:8px}.srow input[type=search]{flex:1}
.cam{flex:0 0 58px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--accent);color:#fff;border-radius:12px;cursor:pointer}
.ocr{font-size:14px;color:var(--mute);margin-top:6px}
input[type=search]{width:100%;font-size:20px;padding:14px 16px;border:2px solid var(--accent);border-radius:12px;background:#fff;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:14px;cursor:pointer;color:var(--ink)}
.chip b{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.card h2{margin:0 0 2px;font-size:19px}
.code{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:1px 8px;font-size:14px;font-weight:700;margin-right:6px;vertical-align:2px}
.en{color:var(--mute);font-size:13px;font-family:ui-monospace,Consolas,monospace}
.cause{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.cause h3{margin:0 0 4px;font-size:16px}
ol,ul{margin:4px 0 4px;padding-left:22px}
li{margin:3px 0}
.safe{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:15px;margin-top:10px}
.note{background:var(--amberbg);color:var(--amber);border-radius:10px;padding:9px 12px;font-size:15px;margin-top:10px}
.ref{color:var(--mute);font-size:13px;margin-top:8px}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.contact{background:var(--accent2);border-radius:14px;padding:12px 16px;margin-top:18px;font-size:15px}
.contact a{color:var(--accent);font-weight:600}
h2.sec{font-size:18px;margin:22px 0 4px;color:var(--accent)}
.sub{color:var(--mute);font-size:14px;margin:0 0 6px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
td.h{white-space:nowrap;font-weight:600;color:var(--accent)}
.btn{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:15px;border-radius:12px;font-size:18px;margin:12px 0}
.task{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent2);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.task small{display:block;color:var(--mute);font-size:14px}
.hide{display:none}
</style>
</head>

const PUMP = {
 is:p=>({h:"Háþrýstingur dæla "+p, c:[["Bilun í virkni dælu "+p,["Stöðvaðu vélina og ýttu á EXIT.","Athugaðu hvort eitthvað sé fast/stíflað í þeim hluta sem dælan knýr og losaðu það á öruggan hátt (lykill á þér).","Athugaðu olíustöðu og leka.","Ef villan kemur aftur: hafðu samband við þjónustuaðila. Handbókin vísar á bilanaleit og vökvateikningu (Hydraulic scheme)."]]], w:"Ekki opna vökvakerfi undir þrýstingi. Viðgerðir á vökvakerfi eingöngu af hæfu starfsfólki."}),

};

const E = [
{code:"1", screen:"Err 01: EMERGENCY STOP (reset 1)", ref:"10, 31",

  ["Neyðarstoppshnappur á stjórnborði hefur verið sleginn inn",["Gakktu úr skugga um að enginn sé á hættusvæðinu.","Snúðu NEYÐARSTOPPS-hnappnum aftur í venjulega stöðu.","Ýttu á RESET og ræstu aftur."]],
  ["Rauður neyðarhnappur á hlið pressunnar",["Finndu hnappinn sem var sleginn inn (einn á hvorri hlið grindarinnar) og losaðu hann.","Gakktu úr skugga um að enginn sé á hættusvæðinu.","Ýttu á EXIT á skjánum og ræstu aftur."]],
  ["Skoðunarhurðir á pressunni eru opnar",["Gakktu úr skugga um að enginn sé á hættusvæðinu.","Lokaðu skoðunarhurðunum.","Ýttu á RESET og ræstu aftur."]],
  ["Togað í neyðarstoppssnúru á baggafæribandi",["Fjarlægðu baggann/hindrunina fyrst.","Settu bláa rofann úr „off“ í „run“.","Ýttu á EXIT á skjánum og ræstu aftur."]]]},

  ["Emergency stop cable on the bale conveyor was pulled",["Remove the bale/obstacle first.","Reset the blue switch from \"off\" to \"run\".","Press EXIT on the display and start again."]]]},
 lt:{h:"Avarinis stabdymas", c:[

  ["Paspaustas raudonas avarinis mygtukas preso šone",["Suraskite paspaustą mygtuką (po vieną kiekviename rėmo šone) ir atleiskite jį.","Įsitikinkite, kad pavojingoje zonoje nėra žmonių.","Ekrane paspauskite EXIT ir paleiskite iš naujo."]],

  ["Patrauktas ryšulių konvejerio avarinio stabdymo lynas",["Pirmiausia pašalinkite ryšulį/kliūtį.","Perjunkite mėlyną jungiklį iš „off“ į „run“.","Ekrane paspauskite EXIT ir paleiskite iš naujo."]]]}},

{code:"3", screen:"NO NET – Error 3", ref:"26–27, 30",
 kw:"net netrúlla no net flækt tangled knife hnífur netting tinklas tinklo ritinys susipainiojo peilis",
 is:{h:"Ekkert net", c:[
  ["Netrúllan er tóm – skipta um rúllu",["Stöðvaðu vélina, taktu lykilinn úr og hafðu hann á þér allan tímann.","Opnaðu baggahólfið svo netrúllan komist í þægilega stöðu.","Losaðu handfangið til að lækka og létta á tómu rúllunni.","Taktu tómu rúlluna af haldaranum (dragðu handfangið upp og út).","Settu nýja rúllu á haldarann (rétt snúningsátt skv. mynd 2) og ýttu handfanginu aftur til að læsa.","Krækjaðu netinu á föstu loftstútana fyrir aftan mataravalsinn. Netið blæst sjálfkrafa inn þegar vélin fer í gang.","Varist klemmuhættu: notaðu báðar hendur og dragðu handfangið niður til að þrýsta rúllunni upp að mataravalsinum.","Settu lykilinn aftur í, ýttu á RESET og ræstu í sjálfvirkum ham."]],
  ["Netið hefur flækst",["Stöðvaðu vélina, taktu lykilinn úr og hafðu hann á þér.","Notaðu öryggisstoppið á netbúnaðinum ef unnið er nálægt hnífnum. Festu hnífsblaðið ef þarf.","Greiddu úr netinu og fjarlægðu það sem stíflar."]],
  ["Netið klippist ekki – of lítill loftþrýstingur á skurðarbúnaði",["Athugaðu skurðarbúnaðinn.","Athugaðu loftpressuna og endurræstu hana ef þarf."]],
  ["Netið klippist ekki – bitlaus hnífur",["Brýndu eða skiptu um hnífinn (vélin stöðvuð og lykillinn á þér)."]]],
  n:"Netstrekking: stilliskrúfa og þrýstimælir eru hægra megin á grindinni við vökvaúttökin. Fyrir heimilissorp á þrýstingur að vera 0–10 bar. Ef netið er flækt eða búið stöðvast kerfið eftir aðra tilraun."},
 en:{h:"No net", c:[
  ["The net roll is empty – replace the roll",["Stop the machine, withdraw the key and keep it with you the whole time.","Open the bale chamber so the net roll is in a convenient position.","Loosen the handle to lower and release the pressure on the empty roll.","Remove the empty roll from the holder (pull the handle up and out).","Place a new roll on the holder (correct direction, see picture 2) and push the handle back to lock it.","Hook the net onto the fixed air nozzles behind the feeding roll. The net is loaded automatically with compressed air at restart.","Watch out for pinch points: use both hands and pull the handle down to push the roll up against the feeding roll.","Put the key back, press RESET and restart in automatic mode."]],

  ["Net is not cut – blunt knife",["Sharpen or replace the knife (machine stopped, key with you)."]]],
  n:"Net tension: adjustment screw and pressure gauge on the right side of the chassis by the hydraulic outlets. For household waste the pressure should be 0–10 bar. If the net is tangled or empty, the system stops after the second attempt."},
 lt:{h:"Nėra tinklo", c:[
  ["Tinklo ritinys tuščias – pakeiskite ritinį",["Sustabdykite mašiną, ištraukite raktą ir visą laiką laikykite jį prie savęs.","Atidarykite ryšulio kamerą, kad tinklo ritinys būtų patogioje padėtyje.","Atlaisvinkite rankeną, kad nuleistumėte ir atpalaiduotumėte tuščią ritinį.","Nuimkite tuščią ritinį nuo laikiklio (patraukite rankeną aukštyn ir į išorę).","Uždėkite naują ritinį (teisinga kryptis – žr. 2 pav.) ir stumkite rankeną atgal, kad užfiksuotumėte.","Užkabinkite tinklą ant fiksuotų oro antgalių už tiekimo volo. Paleidus mašiną tinklas įpučiamas automatiškai.","Saugokitės prispaudimo: abiem rankomis traukite rankeną žemyn, kad prispaustumėte ritinį prie tiekimo volo.","Įstatykite raktą, paspauskite RESET ir paleiskite automatiniu režimu."]],
  ["Tinklas susipainiojo",["Sustabdykite mašiną, ištraukite raktą ir laikykite jį prie savęs.","Dirbdami prie peilio naudokite tinklo įrenginio saugos stabdiklį. Jei reikia, užfiksuokite peilio ašmenis.","Išpainiokite tinklą ir pašalinkite kliūtį."]],
  ["Tinklas nenukerpamas – per mažas oro slėgis pjovimo įrenginyje",["Patikrinkite pjovimo įrenginį.","Patikrinkite kompresorių ir, jei reikia, paleiskite jį iš naujo."]],
  ["Tinklas nenukerpamas – atšipęs peilis",["Pagaląskite arba pakeiskite peilį (mašina sustabdyta, raktas pas jus)."]]],
  n:"Tinklo įtempimas: reguliavimo varžtas ir manometras dešinėje rėmo pusėje prie hidraulinių išvadų. Buitinėms atliekoms slėgis turi būti 0–10 bar. Jei tinklas susipainiojęs ar baigėsi, sistema sustoja po antro bandymo."}},

{code:"5", screen:"NO WRAPPING – Error 5", ref:"25, 30",
 kw:"plast plastrúlla wrapping film filma pökkun ljósnemi photocell wrapper plėvelė plėvelės ritinys vyniotuvas vyniojimas fotoelementas",
 is:{h:"Engin plastpökkun", c:[
  ["Plastrúllan er tóm – skipta um rúllu",["Farðu aðeins upp stigann og í gegnum öryggishliðið. Hliðið á að vera OPIÐ allan tímann.","Aldrei stíga út fyrir gul/svart merkta öryggissvæðið á pallinum (í átt að pressunni).","Losaðu strekkingarstöngina á pökkunararminum.","Ýttu læsingunni á efri rúlluhaldaranum aftur um leið og þú snýrð haldaranum upp.","Taktu gömlu rúlluna úr og lyftu nýrri á sinn stað. Gakktu úr skugga um að efri haldarinn læsist.","Þræddu filmuna á milli strekkivalsanna skv. myndinni á pökkunararminum.","Brjóttu lausa endann tvöfalt og festu hann í plasthaldarann á skeranum.","Hertu strekkingarstöngina.","Lokaðu öryggishliðinu áður en þú ferð niður stigann.","Ýttu á bláa reset-hnappinn fyrir hliðið og ræstu af skjánum."]],
  ["Plastið hefur slitnað/klippst óvart",["Dragðu filmuna út og festu hana skv. leiðbeiningum á pökkunararminum (sjá skref að ofan)."]],
  ["Ryk eða óhreinindi á ljósnema pökkunarvélar",["Stöðvaðu vélina alveg, taktu lykilinn úr og hafðu hann á þér.","Hreinsaðu ljósnemann."]],
  ["Loftpressan gefur ekki nægan þrýsting",["Athugaðu loftpressuna og endurræstu hana ef þarf.","Tæmdu þéttivatn af pressunni (daglegt verk)."]]],

 en:{h:"No wrapping", c:[
  ["The plastic roll is empty – replace the roll",["Use only the stairs and the safety gate to reach the platform. Leave the gate OPEN the whole time.","Never step outside the yellow/black marked safety area on the platform (towards the baler).","Release the tensioning lever on the wrapper arm.","Push the lock on the upper roll holder backwards while turning the holder upwards.","Remove the old roll and lift the new one into place. Make sure the upper holder locks.","Thread the film between the tension rollers as shown on the wrapper arm.","Double-fold the loose end and attach it to the plastic holder on the cutter.","Tighten the tension lever.","Close the safety gate before going down the stairs.","Press the blue reset button for the gate and restart from the display."]],

  n:"Store stretch film rolls above 0 °C."},
 lt:{h:"Nėra vyniojimo", c:[
  ["Plėvelės ritinys tuščias – pakeiskite ritinį",["Į platformą lipkite tik laiptais ir per apsauginius vartus. Vartai turi būti ATIDARYTI visą laiką.","Niekada neišeikite už geltonai/juodai pažymėtos saugios zonos platformoje (preso link).","Atleiskite įtempimo svirtį ant vyniotuvo rankos.","Stumkite viršutinio ritinio laikiklio fiksatorių atgal ir kartu pakelkite laikiklį aukštyn.","Išimkite seną ritinį ir įkelkite naują. Įsitikinkite, kad viršutinis laikiklis užsifiksavo.","Perverkite plėvelę tarp įtempimo volų, kaip parodyta ant vyniotuvo rankos.","Laisvą galą perlenkite dvigubai ir pritvirtinkite prie plėvelės laikiklio ant kirptuvo.","Užveržkite įtempimo svirtį.","Prieš lipdami laiptais žemyn uždarykite apsauginius vartus.","Paspauskite mėlyną vartų RESET mygtuką ir paleiskite iš ekrano."]],

  ["Dulkės ar nešvarumai ant vyniotuvo fotoelemento",["Visiškai sustabdykite mašiną, ištraukite raktą ir laikykite jį prie savęs.","Nuvalykite fotoelementą."]],

{code:"6", screen:"HIGH PRESSURE PUMP 1 – Error 6", ref:"15, 27–28, 30",
 kw:"stífla blockage blocked overload yfirfullt hólf pump 1 dæla háþrýstingur high pressure deblock užsikimšimas užsikišo perkrauta kamera siurblys aukštas slėgis",
 is:{h:"Háþrýstingur dæla 1 – oftast stífla", c:[
  ["Efni fast / baggahólf yfirfullt (algengast)",["Fjarstýringin fer sjálfkrafa í losunarham. Hnappar 1–4 breytast: 1 = mötun/hólfendar áfram, 2 = loka hólfi, 3 = opna hólf (stutt ýting), 4 = stöðva dælur.","Reyndu fyrst að keyra efri mötunarmottuna afturábak til að losa efnið.","Ef hólfið er stíflað: opnaðu aftari hluta hólfsins örlítið með fjarstýringunni (léttir á þrýstingi).","Keyrðu hólfendana í 3–4 sekúndur.","Lokaðu hólfinu aftur og ræstu í sjálfvirkum ham.","Endurtaktu eins oft og þarf þar til stíflan losnar."]],

  ["Siurblio 1 veikimo gedimas",["Jei užsikimšimo nėra: kreipkitės į servisą (gedimų paieškos vadovas ir hidraulinė schema)."]]],

/* ===== Mynd -> OCR (tesseract.js, keyrir í símanum) ===== */
let tessP=null,workerP=null;
function loadTess(){if(!tessP)tessP=new Promise((res,rej)=>{if(window.Tesseract)return res();const sc=document.createElement('script');sc.src=window.__TESS_SRC||'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)});return tessP}
async function getWorker(){if(!workerP)workerP=(async()=>{await loadTess();return await Tesseract.createWorker('eng',1,window.__TESS_OPTS||{});})();return workerP}
function pickQuery(txt){const t=txt.toUpperCase().replace(/[|]/g,'I').replace(/\s+/g,' ');
  if(/F[5S][-–—.]?\s?2|[X%]\s?114/.test(t))return "22";
  {const xm=t.match(/[X%]1([123])([0-7])/);if(xm)return "x1"+xm[1]+xm[2];}
  let m=t.match(/(?:ERR|R{1,2}OR)\s*[:.;,]?\s*0?(\d{1,2})\b/); if(m) return String(+m[1]);
  const keys=["NO NET","NO WRAPPING","EMERGENCY","BALE CONVEYOR","OVER LOAD","OVERLOAD","PLATFORM GATE","LOCKED","LOW OIL","OIL LEVEL","FILTER","HIGH PRESSURE PUMP"];
  for(const k of keys){if(t.includes(k)){if(k==="HIGH PRESSURE PUMP"){const p=t.match(/PUMP\s*(\d)/);const map={"1":"6","2":"7","3":"8","4":"8","5":"9","6":"9","7":"10","8":"11","9":"11"};if(p)return map[p[1]];}return k.replace("OVER LOAD","OVERLOAD").toLowerCase();}}
  return null;}
function toCanvas(src,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(src,0,0,w,h);return c}
function rotated(src,deg,scale){const r=Math.abs(deg)%180===90;const w=src.width*scale,h=src.height*scale;const c=document.createElement('canvas');c.width=r?h:w;c.height=r?w:h;const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(deg*Math.PI/180);x.imageSmoothingQuality='high';x.drawImage(src,-w/2,-h/2,w,h);return c}
/* Finnur rauða villuborðann á skjánum, réttir hann af og gerir textann svartan á hvítu */
function redPts(img){const {width:W,height:H}=img;const d=img.getContext('2d').getImageData(0,0,W,H).data;const xs=[],ys=[];const st=Math.max(1,Math.round(Math.max(W,H)/900));
  for(let y=0;y<H;y+=st)for(let x=0;x<W;x+=st){const i=(y*W+x)*4,r=d[i],g=d[i+1],b=d[i+2];if(r>120&&r-g>60&&r-b>20){xs.push(x);ys.push(y)}}return {xs,ys}}
function rotFree(src,rad){const c=Math.abs(Math.cos(rad)),s=Math.abs(Math.sin(rad));const W=Math.ceil(src.width*c+src.height*s),H=Math.ceil(src.width*s+src.height*c);const o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,W,H);x.translate(W/2,H/2);x.rotate(rad);x.drawImage(src,-src.width/2,-src.height/2);return o}
function bandCanvas(img){let {xs,ys}=redPts(img);if(xs.length<120)return null;
  const n=xs.length;let mx=0,my=0;for(let i=0;i<n;i++){mx+=xs[i];my+=ys[i]}mx/=n;my/=n;let sxx=0,syy=0,sxy=0;for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;sxx+=dx*dx;syy+=dy*dy;sxy+=dx*dy}
  const th=0.5*Math.atan2(2*sxy,sxx-syy);const im2=rotFree(img,-th);({xs,ys}=redPts(im2));if(xs.length<120)return null;
  xs.sort((p,q)=>p-q);ys.sort((p,q)=>p-q);const pc=(a,f)=>a[Math.floor((a.length-1)*f)];const W=im2.width,H=im2.height,m=4;
  const x0=Math.max(0,pc(xs,.01)-m),x1=Math.min(W,pc(xs,.99)+m),y0=Math.max(0,pc(ys,.02)-m),y1=Math.min(H,pc(ys,.98)+m);const cw=x1-x0,ch=y1-y0;if(cw<8||ch<8)return null;
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const cx=c.getContext('2d');cx.drawImage(im2,x0,y0,cw,ch,0,0,cw,ch);const id=cx.getImageData(0,0,cw,ch),p=id.data;
  let mn=255,mxv=0;for(let i=0;i<p.length;i+=4){const v=255-p[i+1];if(v<mn)mn=v;if(v>mxv)mxv=v}const k=mxv>mn?255/(mxv-mn):1;
  for(let i=0;i<p.length;i+=4){const v=Math.max(0,Math.min(255,(255-p[i+1]-mn)*k));p[i]=p[i+1]=p[i+2]=v}cx.putImageData(id,0,0);return c}
async function readPhoto(file){const bmp=await createImageBitmap(file);const sc=Math.min(1,2400/Math.max(bmp.width,bmp.height));const img=toCanvas(bmp,Math.round(bmp.width*sc),Math.round(bmp.height*sc));
  const w=await getWorker();let all="";
  const band=bandCanvas(img);
  if(band){const thick=Math.min(band.width,band.height),s2=Math.max(1,Math.min(4,110/thick));const tries=band.height>band.width?[-90,90]:[0,180];
    await w.setParameters({tessedit_pageseg_mode:'7'});
    for(const deg of tries){const r=await w.recognize(rotated(band,deg,s2));const txt=(r.data.text||"").replace(/\s+/g," ").trim();all+=" "+txt;const q=pickQuery(txt);if(q)return {q,txt};}}
  await w.setParameters({tessedit_pageseg_mode:'3'});
  for(const deg of [0,-90,90]){const r=await w.recognize(rotated(img,deg,1));const txt=(r.data.text||"").replace(/\s+/g," ").trim();all+=" "+txt;const q=pickQuery(txt);if(q)return {q,txt};}
  return {q:null,txt:all.trim()};}
